<section class="workbench" aria-label="RenderLab workbench">
  <aside class="rail rail--left">
    <h2>{{ panels()[0] }}</h2>
  </aside>

  <section class="canvas">
    <div class="canvas__toolbar">
      <h1>{{ panels()[1] }}</h1>
    </div>
    <div class="canvas__stage">
      <div class="frame">
        <div class="frame__card">1</div>
        <div class="frame__card">2</div>
        <div class="frame__card">3</div>
        <div class="frame__card">4</div>
        <div class="frame__card">5</div>
      </div>
    </div>
  </section>

  <aside class="rail rail--right">
    <div class="inspektor">
      <h2>{{ panels()[2] }}</h2>
      <div class="inspektor__layout">

      </div>
    </div>
    <div class="metrics">
      <h2>{{ panels()[3] }}</h2>
    </div>
  </aside>
</section>
